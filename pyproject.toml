[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melodie-kimini"
version = "3.1.0"
description = "Melodie-Kimini GODLIKE CLI - 56 AI Models, Karma Power Points, MA Token Crypto Economy, Enterprise Business Ranking, Social Media Sharing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Melodiespark Inc", email = "team@melodiespark.com"},
]
keywords = ["ai", "karma", "crypto", "enterprise", "cli", "models", "tokens"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "web3>=7.0",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
relay = [
    "litellm>=1.40",
    "stripe>=7.0",
]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
    "build>=0.10",
]
web3 = [
    "eth-tester>=0.13",
    "py-evm>=0.12",
]

[project.urls]
Homepage = "https://github.com/melodielovemax-svg/KIMINI-CLI-Agents_CODING-Unlimited_Crypto_Karma_Earning"
Repository = "https://github.com/melodielovemax-svg/KIMINI-CLI-Agents_CODING-Unlimited_Crypto_Karma_Earning"
Issues = "https://github.com/melodielovemax-svg/KIMINI-CLI-Agents_CODING-Unlimited_Crypto_Karma_Earning/issues"

[project.scripts]
Melodie-Kimini = "melodie_kimini.cli:main"
kimini-relay = "melodie_relay.cli:main"
karma-eco = "karma_ecosystem.cli:main"

[tool.setuptools.packages.find]
include = ["melodie_kimini*", "melodie_relay*", "karma_ecosystem*"]

[tool.setuptools.package-data]
melodie_kimini = ["*.json"]
melodie_relay = ["models/*.yaml"]
karma_ecosystem = ["contracts/build/*.json"]
